[package]
name = "capcheck"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/octofhir/capcheck"
homepage = "https://github.com/octofhir/capcheck"
description = "Checks a FHIR server's CapabilityStatement against what the server really does"
keywords = ["fhir", "conformance", "capabilitystatement", "healthcare", "ci"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = [".github/"]

[[bin]]
name = "capcheck"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `capcheck` command line.
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"
